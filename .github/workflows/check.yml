name: Source checks
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # The bundled runtime is assembled by `npm run stage`, which needs large
      # downloads, so CI checks the sources only.
      - run: mkdir -p build/backend build/engine build/runtime
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test scripts/test-language.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
