style01: "电影精致写实风格，构图克制、大量留白、光影深邃且色调简约；根据文案自适应景别（抽象叙事用远景，具体场景用中近景）；若出现女性角色，高颜值、极具性感吸引力，穿着贴合时代与场景的轻盈修身服饰，自然展露曼妙曲线与迷人气质；男性角色保持正常。"
style02: "莫奈风格，营造温馨治愈；三分法构图，画面简约；柔和光线，浅暖色调为主，明度中等。"
style03: "爱德华·霍普的风格；三分法构图，近景构图，有纵深感、深邃感。"
style04: "高品质科幻CG动画风格；三分法构图，画面简约克制、留白充足；根据文案自适应景别（抽象概念与宏大叙事用远景，具体情节与道具用中近景）；深邃青蓝与暗灰基调，搭配温暖的琥珀金光影点缀。"
style05: "《经济学人》（The Economist）社论概念插画风格；极简构图，大量留白，富有巧思的视觉隐喻；扁平手绘与纸质拼贴质感，带细腻纸张肌理；低饱和米白/灰蓝基调，搭配单一经济学人红或亮色点缀。"
style06: "宫崎骏风格；三分法，有大量留白，有氛围感；色彩简单，高清画面。"
style07: "新海诚风格；三分法，有大量留白，有氛围感；色彩简单，高清画面。"
style08: "水墨画，大约3种颜色，有色彩点缀不单调；三分法构图，巨大的留白。"
style09: "雷内·马格利特式超现实概念插画；极简构图、大面积留白与深邃纵深感；将日常具象物体与抽象意象超现实并置，富有静谧的哲思氛围；哑光质感，天蓝、云白、炭黑与低饱和灰调为主；人物以背影、剪影或意象遮挡面部呈现。"
style10: "极简主义摄影，结合巴洛克风格；三分法构图，有纵深感，有留白；主色调为柔和的白色、黑色和金色；若出现人物元素，需统一使用黑色剪影。"
style11: "顶级科学杂志概念插画风格（类似 Quanta Magazine 与 Nature 封面）；极简构图，三分法，大面积留白，强烈的几何秩序感与空间纵深；将素数、坐标轴、波形、网格与神经网络光点抽象为克制的视觉隐喻；主色调为深靛蓝、象牙白与暖琥珀金点缀；避免写实人脸与杂乱背景，线条利落精致，高级学术质感。"
