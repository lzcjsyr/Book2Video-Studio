style01: "电影精致写实风格，构图克制、大量留白、光影深邃且色调简约；根据文案自适应景别（抽象叙事用远景，具体场景用中近景）；若出现女性角色，高颜值、极具性感吸引力，穿着贴合时代与场景的轻盈修身服饰，自然展露曼妙曲线与迷人气质；男性角色保持正常。"
style02: "莫奈印象派油画风格，营造静谧温馨的治愈氛围；细腻可见的油画笔触与柔和边界，强调斑驳通透的自然光影与空气感；三分法构图，画面简约舒展、留白充足；色调以奶白、浅暖金、柔粉与淡粉蓝/草绿的低饱和浅暖色为主，明度柔和适中。"
style03: "爱德华·霍普（Edward Hopper）式美式写实油画风格，哑光画布质感，富有克制孤寂的静谧叙事感；三分法构图，大量留白与建筑空间纵深感，以中景为主并随文案自适应远近；标志性的斜射硬朗自然光或暖黄窗光，形成利落的明暗几何色块切割；低饱和复古色调，以深蓝绿、暖赭黄、砖红与灰褐为主。"
style04: "高品质科幻CG动画风格；三分法构图，画面简约克制、留白充足；根据文案自适应景别（抽象概念与宏大叙事用远景，具体情节与道具用中近景）；深邃青蓝与暗灰基调，搭配温暖的琥珀金光影点缀。"
style05: "《经济学人》（The Economist）社论概念插画风格；极简构图，大量留白，富有巧思的视觉隐喻；扁平手绘与纸质拼贴质感，带细腻纸张肌理；低饱和米白/灰蓝基调，搭配单一经济学人红或亮色点缀。"
style06: "宫崎骏吉卜力经典手绘动画风格；温润的手绘赛璐璐线条搭配水彩水粉质感背景，富有自然生命力与静谧治愈感；三分法构图，大面积天空或景物留白；柔和日光与细腻云影，色调温暖清澈，以天蓝、草绿、暖米白与原木色为主，画面干净克制。"
style07: "新海诚电影级现代动画风格；极致细腻通透的数码光影、强烈空气透视与柔美逆光/丁达尔光晕，注重通透云层、水面或玻璃的微光反射；三分法构图，宏阔留白与深邃空间感；清澈通透的冷暖色调对比，以钴蓝、暮紫搭配黄昏暖橙或柔粉高光，画面干净克制。"
style08: "现代新中式写意水墨画风格；细腻宣纸肌理，讲究干湿浓淡的墨韵晕染与留白飞白笔触；三分法构图，大面积素净留白，极具东方意境与空间纵深感；色调严格克制在3种以内：温润宣纸米白底色、深浅层次水墨黑灰，辅以极少量朱砂红或淡石青作为点睛点缀。"
style09: "雷内·马格利特式超现实概念插画；极简构图、大面积留白与深邃纵深感；将日常具象物体与抽象意象超现实并置，富有静谧的哲思氛围；哑光质感，天蓝、云白、炭黑与低饱和灰调为主；人物以背影、剪影或意象遮挡面部呈现。"
style10: "极简主义艺术摄影与巴洛克光影美学融合；三分法构图，画面极度克制、大面积留白且富有空间纵深感；采用巴洛克式明暗对照戏剧光影，局部融入大理石、丝绒或鎏金的细腻古典质感；主色调严格限定为柔和象牙白、深邃炭黑与低调哑光金；若出现人物元素，统一以纯黑色修长剪影呈现。"
