# 第四步静态生图提示词模板
#
# 编辑说明：
# - 配置文件通过 step4.image_prompt_template 选择下面的模板 ID。
# - label 和 description 仅供人类阅读，不会发送给生图模型。
# - template 中必须保留 {summary}、{segment}、{style_block} 三个变量。
# - 使用 YAML 的 | 多行文本格式，缩进两个空格即可原样编辑提示词。

keywords:
  label: 原有图示关键词模板
  description: 完整保留项目原有模板，以图示为主、中文关键词为辅。
  template: |
    为视频文案的每一段生成一张配图，用图示为主、文字为辅，帮助读者更好地理解内容。
    文字规范：只需要2到4个突出段落主旨的关键词。每个词都以极度简短为第一原则。关键词与背景颜色形成鲜明反差，确保可读性。
    配图规范：文字必须为中文，位置只能出现在图片的上半部分。整体画面应匹配内容主题，简约美观，不得出现诡异、恐怖的元素。

    以下是全文概述，不是展示的重点：
    {{
    {summary}
    }}

    以下是需要生成配图的文案内容，信息的核心：
    {{
    {segment}
    }}

    请严格遵循以下画面风格设定：
    {{
    {style_block}
    }}

pure_images:
  label: 纯图
  description: 生成无文字、主体明确、具有情绪张力的电影感场景。
  template: |
    为视频文案的每一段生成一张配图，用图示为主、文字为辅，帮助读者更好地理解内容。
    如果是历史宏达叙述或哲思类语言则用大远景，若是具象的场景描述则用中景或近景，总之根据当前具体文案决定。
    画面必须无文字，以明确主体、真实空间关系、光影和情绪张力表达内容；不得出现任何文字、字母、数字、标识或水印。

    以下是全文概述，仅用于理解上下文与保持系列画面连贯：
    {{
    {summary}
    }}

    以下是当前配图必须准确表达的文案内容：
    {{
    {segment}
    }}

    请严格遵循以下画面风格设定：
    {{
    {style_block}
    }}

story_scene:
  label: 剧情分镜（人物一致）
  description: 严格按当前句剧情画具体场景、人物动作与情绪，优先锁定全文设定中的真实人物与角色外观一致性，无文字。
  template: |
    你是一位电影分镜概念画师。请严格根据「当前段落剧情」绘制一帧叙事画面，像连续纪录片或电影剧照一样还原这一句话发生的具体事件、人物动作、神态情绪与环境细节，不要画抽象图标、数据图表或无关的象征物。

    人物与连贯性规则（最高优先级）：
    1. 严格参照「全文背景与人物视觉设定」中的人物清单。若当前句提到或指代（如“他”、“她”、“创始人”、“兄弟俩”、“团队”等）设定中的人物，必须画出对应人物，并严格保持其真实长相/姓名、年龄、发型、面部特征、体型与固定穿搭一致，禁止随意替换成陌生人。
    2. 若涉及真实公众人物或现实机构/地标（如科技创始人、交易所、实验室、会议室等），必须高度还原其真实可辨识的外貌特征与场景氛围。
    3. 景别与构图完全服务于当前句剧情：宏大事件、时代或地点交代用远景/全景，人物冲突、对话、决策或情绪细节用中景/近景特写。
    4. 画面禁止出现任何文字、字幕、字母、数字、标签或水印（真实场景中不可避免的极小环境细节除外）。

    以下是全文背景与核心人物视觉设定（用于锁定人物外貌、身份与系列画面连贯性）：
    {{
    {summary}
    }}

    以下是当前画面必须忠实还原的段落剧情（本张图的唯一主体与动作来源）：
    {{
    {segment}
    }}

    请将上述具体剧情与人物，以以下艺术画风呈现（若画风中的“抽象/简单线条/剪影”描述与具体人物还原冲突，以清晰还原剧情和人物辨识度为优先）：
    {{
    {style_block}
    }}
